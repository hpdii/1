spring.application.name=donk-server

# Port: Mac dinh 8081 tren local (tranh PEMHTTPD-x64 chiem 8080).
# Tren cloud (Railway/Render), he thong truyen bien PORT thi Spring Boot se bind theo PORT do.
server.port=${PORT:8081}

# KHONG dat server.address. Mac dinh Spring Boot bind 0.0.0.0 — do la thu
# dien thoai can de goi vao. Dat 127.0.0.1 o day la nguyen nhan so 1 cua
# loi "localhost chay duoc nhung dien thoai khong ket noi duoc".

# --- MySQL ---
# Ho tro ca local (localhost:3306/donk) va cloud (Railway tu dong truyen MYSQLHOST, MYSQLPORT, MYSQLDATABASE, v.v.)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:donk}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=utf8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:123456}}

# validate tren local; tren cloud co the override bang bien HIBERNATE_DDL_AUTO=update neu database moi chua co bang.
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Upload ---
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB
server.tomcat.max-swallow-size=-1

app.upload.dir=${APP_UPLOAD_DIR:D:/Donk/server/uploads}

# --- Cloudinary (Luu video & avatar len Cloudinary CDN) ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:qloyy5c1}
cloudinary.api-key=${CLOUDINARY_API_KEY:113475237214213}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:StqubZ7KV0zU3g75w0Eh4MLByvc}

# --- JWT ---
app.jwt.secret=${JWT_SECRET:donk-dev-secret-key-change-me-in-production-0123456789}
app.jwt.expiration-days=7

# --- Khac ---
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always
server.error.include-stacktrace=never
